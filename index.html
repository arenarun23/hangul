<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2d6cdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한글 쓰기</title>
<link rel="stylesheet" href="../fonts/noto-sans-kr.css">
<style>
  :root{color-scheme:light dark;--bg:#f3f6fc;--panel:#ffffff;--ink:#1f2430;--mute:#6b7488;--line:#d3dbec;--accent:#2d6cdf;--accent2:#1f9d6b;--guide:#dbe5fa}
  @media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1b1f29;--ink:#eef1f8;--mute:#9aa3b8;--line:#343b4d;--accent:#7fb0ff;--accent2:#6fd1a6;--guide:#4a5b86}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:700;padding:12px}
  .app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:0;display:flex;flex-direction:column}
  .left{grid-row:1/3}
  h2{margin:0 0 8px;font-size:20px;color:var(--mute);font-weight:700;letter-spacing:.05em}
  #pad{flex:1;min-height:0;position:relative;background-color:var(--panel);border:1px dashed var(--line);border-radius:10px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
  #guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--guide);font-weight:900;line-height:1;white-space:nowrap;pointer-events:none;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #pad,canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none;font-size:22px;text-align:center;padding:0 10px}
  .cands{display:flex;gap:6px;margin-top:10px;min-height:42px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  #cands{position:absolute;left:6px;right:6px;bottom:6px;margin:0;min-height:0;z-index:2}
  #cands:empty{display:none}
  #cands .chip{background:var(--panel)}
  .chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:21px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .bar{display:flex;gap:8px;margin-top:10px}
  button.btn{flex:1 1 0;min-width:0;white-space:nowrap;padding:14px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:24px;cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #bRec{font-size:32px;line-height:1}
  .btn .ico{width:1.3em;height:1.3em;vertical-align:-.25em}
  .mode{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:16px;color:var(--mute)}
  .seg{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:2px 10px;font:inherit;font-size:19px;cursor:pointer}
  .seg.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  #status{font-size:18px;color:var(--mute);margin-top:6px;min-height:20px}
  .hangul{position:relative;align-items:center;justify-content:center;text-align:center}
  .hrow{display:flex;align-items:center;justify-content:center;gap:.2em;flex-wrap:nowrap;white-space:nowrap;font-size:120px;flex:1 1 0;min-height:0;width:100%;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hrow:active{transform:scale(.97)}
  #big{font-weight:900;font-size:1em;line-height:1.1;letter-spacing:.04em;color:var(--accent)}
  #big.placeholder{color:var(--mute)}
  #pic{font-size:.6em;flex:none;line-height:1;min-height:0}
  #pic:empty{display:none}
  #reading{font-size:30px;margin-top:6px}
  #stars{font-size:26px;min-height:30px;letter-spacing:2px}
  #level,#cats{display:flex;gap:6px;flex:none}
  .vsep{color:var(--line)}
  #level .seg{font-size:19px;padding:3px 10px}
  #listen{font-size:18px;color:var(--mute);margin-top:2px;cursor:pointer}
  .vox{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:18px;color:var(--mute)}
  .vox label{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .vox input{width:130px;accent-color:var(--accent2);height:28px}
  .vox select{font:inherit;font-size:16px;max-width:190px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
  #inks{display:flex;gap:6px;align-items:center}
  .ink{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font:inherit;font-size:12px;color:var(--ink);background:var(--panel);padding:0;cursor:pointer}
  .ink.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  #inks .ink[data-k=auto]{width:auto;border-radius:14px;padding:0 8px}
  .vox b{min-width:2.2em;color:var(--ink)}
  #vtoggle{display:none;position:absolute;top:6px;right:8px;z-index:3;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer}
  .info{overflow:auto}
  .info > *{flex-shrink:0}
  .info p{margin:0 0 8px;line-height:1.6;font-size:22px}
  .info ul.cols{margin:0 0 8px;padding-left:22px;line-height:1.55;font-size:22px;columns:170px 3;column-gap:22px}
  .info li{break-inside:avoid;white-space:nowrap}
  .tag{font-size:18px;color:var(--accent2);margin:6px 0 2px}
  .placeholder{color:var(--mute)}
  .jm{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 8px;margin:0 2px}
  .gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .gc{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:32px;line-height:1.1}
  .gc small{font-size:18px;color:var(--mute)} .gc i{font-style:normal;font-size:28px}
  .gc:hover,.gc.sel{border-color:var(--accent)}
  .ok{color:var(--accent2)}
  .loading{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop .5s}
  @media (max-height:800px){ #listen{display:none} }
  @media (max-width:900px){
    body{padding:8px;overflow:hidden}
    .app{height:calc(var(--appH,100dvh) - 16px);grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,56fr) minmax(0,23fr) minmax(0,21fr);gap:6px}
    #vtoggle{display:block}
    .hangul:not(.showvox) .vox{display:none}
    .hangul.showvox .vox{position:absolute;left:8px;right:52px;top:6px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 8px;margin:0}
    .mode{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:6px}
    #stars{font-size:20px;min-height:24px}
    .left{grid-row:auto}
  }
  @media (max-width:900px) and (max-height:700px){
    .app{grid-template-rows:minmax(0,56fr) minmax(0,23fr) minmax(0,21fr)}
    .cands{min-height:34px}
    .left button.btn{padding:6px 2px}
    .left .mode{margin-top:4px}
  }
  @media (max-width:600px), (max-height:520px){
    .panel{padding:10px;border-radius:12px}
    h2{font-size:14px;margin-bottom:4px}
    #pad{min-height:90px}
    button.btn{font-size:clamp(14px,4.7vw,19px);padding:10px 2px}
    .cands{margin-top:6px}
    .chip{font-size:18px;padding:2px 10px}
    #listen{display:none}
    .hangul{justify-content:flex-start;overflow:hidden}
    .bar{margin-top:8px;gap:6px}
    .mode{margin-top:5px;gap:4px;font-size:13px}
    .mode .seg{font-size:15px;padding:1px 7px}
    #level .seg{font-size:15px;padding:1px 7px}
    .cands{min-height:32px;margin-top:5px}
    .bar{margin-top:6px}
    #bRec{font-size:26px}
    .left{position:relative}
    .left h2{display:none}
    #status{position:absolute;top:12px;left:16px;right:16px;z-index:2;pointer-events:none;font-size:14px;min-height:0;margin:0;padding:1px 8px;border-radius:8px;background:var(--panel);opacity:.92;width:fit-content;max-width:calc(100% - 32px)}
    #status:empty{display:none}
    #hint{font-size:16px}
    #reading{font-size:22px;margin-top:2px}
    .vox{gap:8px;font-size:14px;margin-top:4px}.vox input{width:80px;height:22px}
    .info p,.info ul.cols{font-size:18px}.info h2{font-size:14px}
    .tag{font-size:14px}
    .gc{font-size:28px;padding:4px 8px}.gc small{font-size:14px}.gc i{font-size:22px}
    .gchips{gap:6px}
  }
/* AIEDU 허브로 가는 아이콘 — 모든 서비스 공통 모양·위치: 페이지 왼쪽 위(body 첫 요소). 앱마다 이 자리를 비워 둔다 */
.aiedu-home{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:max(8px,env(safe-area-inset-top,0px));z-index:1000;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,#ffe58f,#ffb08e);border:2px solid #fff;box-shadow:0 2px 0 rgba(74,52,38,.22);text-decoration:none;-webkit-tap-highlight-color:transparent}
.aiedu-home svg{width:30px;height:30px;display:block}
.aiedu-home:active{transform:translateY(2px);box-shadow:none}
.aiedu-home:focus-visible{outline:3px solid #f08a00;outline-offset:2px}
.left h2{padding-left:52px}
@media (max-width:600px),(max-height:520px){.left{padding-top:52px}}
</style>
<script src="../aiedu-log.js"></script>
</head>
<body>
<a class="aiedu-home" href="../" title="AIEDU 처음으로" aria-label="AIEDU 허브로 돌아가기"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><polygon points="32,6 39.2,23.6 58,25.2 43.7,37.6 48.1,56 32,46.2 15.9,56 20.3,37.6 6,25.2 24.8,23.6" fill="#ff7aa8" stroke="#ff7aa8" stroke-width="6" stroke-linejoin="round"/><ellipse cx="25.5" cy="33" rx="2.4" ry="3.2" fill="#4a3426"/><ellipse cx="38.5" cy="33" rx="2.4" ry="3.2" fill="#4a3426"/><ellipse cx="20.5" cy="39.5" rx="3.4" ry="2.1" fill="#ff4f86" opacity=".5"/><ellipse cx="43.5" cy="39.5" rx="3.4" ry="2.1" fill="#ff4f86" opacity=".5"/><path d="M28 39.5q4 4.4 8 0" fill="none" stroke="#4a3426" stroke-width="2.4" stroke-linecap="round"/></svg></a>
<script>
/* AIEDU 복귀 아이콘 보호: 끌거나(8px 이상) 브라우저가 가로챈 동작(당겨서 새로 고침·스크롤)이나 페이지가 열린 직후 1초 안의 클릭은 무시하고, 의도한 한 번의 탭만 허브로 이동한다 */
(function(){var a=document.querySelector('.aiedu-home');if(!a)return;var born=Date.now(),sx=0,sy=0,bad=false;
a.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;bad=false},{passive:true});
a.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)bad=true},{passive:true});
a.addEventListener('pointercancel',function(){bad=true},{passive:true});
a.addEventListener('click',function(e){if(bad||Date.now()-born<1000){e.preventDefault();bad=false}});
a.draggable=false;})();
</script>
<div class="app">
  <section class="panel left">
    <h2>필기 · 음성 입력</h2>
    <div id="pad"><div id="guide"></div><canvas id="cv"></canvas><div id="hint">여기에 한글을 써 보세요 (예: 가, 학교)</div><div class="cands" id="cands"></div></div>
    <div id="status"></div>
    <div class="mode" id="modebar"><span id="level"><button class="seg on" data-l="kid">🧒 유아</button><button class="seg" data-l="school">🎒 1·2학년</button></span><span class="vsep">|</span><span id="cats"></span></div>
    <div class="bar">
      <button class="btn" id="bWrite">✍️ 필기</button>
      <button class="btn" id="bRec" title="말하기 (누르면 듣고, 다시 누르면 멈춰요)">🎤</button>
      <button class="btn" id="bClear" title="지우기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.2 3.3a2 2 0 0 1 2.8 0l1.7 1.7a2 2 0 0 1 0 2.8L11 17.5H6.2L3.3 14.6a2 2 0 0 1 0-2.8z" fill="#f4a3b5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.3 6.2l8.5 8.5" stroke="currentColor" stroke-width="1.4"/><path d="M6.2 17.5H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> 지우기</button>
    </div>
  </section>

  <section class="panel hangul">
        <div class="hrow"><div id="big" class="placeholder">한글</div><div id="pic"></div></div>
    <div id="reading"></div>
    <div id="stars" title="잘 쓴 횟수"></div>
    <div id="listen">🔊 글자를 누르면 읽어줘요</div>
    <button id="vtoggle" title="읽기 속도·소리 크기">⚙️</button>
    <div class="vox">
      <label>🐢 속도 <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.8"><b id="rateV">0.8</b></label>
      <label>🗣 목소리 <select id="voice"><option value="">자동</option></select></label>
      <label>✏️ 글씨 색 <span id="inks"><button data-k="auto" class="ink on">자동</button><button data-k="#ffffff" class="ink" style="background:#fff"></button><button data-k="#1c2030" class="ink" style="background:#1c2030"></button><button data-k="#ffd54a" class="ink" style="background:#ffd54a"></button><button data-k="#ff6b6b" class="ink" style="background:#ff6b6b"></button><button data-k="#4cd9a0" class="ink" style="background:#4cd9a0"></button></span></label>
      <label>🔈 크기 <input type="range" id="vol" min="0.2" max="1" step="0.1" value="1"><b id="volV">1.0</b></label>
    </div>
  </section>

  <section class="panel info" id="info">
    <h2 id="infoH">글자 풀이</h2>
    <p class="placeholder" id="intro"></p>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- 내장 낱말 (저장소·서버 없음) ---------------- */
const RAW = {
  '동물':'강아지🐶 고양이🐱 토끼🐰 거북이🐢 사자🦁 호랑이🐯 코끼리🐘 원숭이🐵 기린🦒 돼지🐷 소🐮 말🐴 닭🐔 오리🦆 개구리🐸 나비🦋 벌🐝 물고기🐟 고래🐳 곰🐻 여우🦊 펭귄🐧 상어🦈 뱀🐍',
  '먹거리':'사과🍎 바나나🍌 포도🍇 딸기🍓 수박🍉 귤🍊 복숭아🍑 감🍅 배🍐 밥🍚 빵🍞 우유🥛 달걀🥚 치즈🧀 피자🍕 라면🍜 과자🍪 사탕🍬 아이스크림🍦 당근🥕 옥수수🌽 김밥🍙 물💧',
  '탈것·물건':'자동차🚗 버스🚌 기차🚆 비행기✈️ 배🚢 자전거🚲 책📖 연필✏️ 가방🎒 시계⏰ 모자🧢 신발👟 안경👓 우산☂️ 공⚽ 집🏠 학교🏫 문🚪 의자🪑 전화📞 컴퓨터💻 풍선🎈 선물🎁',
  '학교·가족':'선생님👩‍🏫 친구🧑‍🤝‍🧑 교실🏫 운동장🏟️ 공책📓 지우개🧽 가위✂️ 크레파스🖍️ 동생👶 형🧑 누나👧 언니👧 할머니👵 할아버지👴 가족👨‍👩‍👧 학생🧑‍🎓 숙제📝 급식🍱 도서관📚 노래🎵 그림🖼️',
  '몸·자연':'눈👁️ 코👃 입👄 귀👂 손✋ 발🦶 머리💇 하늘☁️ 구름☁️ 바다🌊 산⛰️ 나무🌳 꽃🌸 해☀️ 달🌙 별⭐ 비🌧️ 눈사람⛄ 바람🌬️ 무지개🌈 불🔥 흙🌱 엄마👩 아빠👨 아기👶'
};
const CATS = {}, PIC = {}, ALL = [];
for (const c in RAW){ CATS[c] = []; RAW[c].split(' ').forEach(t=>{ const m = t.match(/^([가-힣]+)(.+)$/); if (m){ CATS[c].push(m[1]); if (!PIC[m[1]]) { PIC[m[1]] = m[2]; ALL.push(m[1]); } } }); }
const JAMO_C = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'.split(''), JAMO_V = 'ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ'.split('');
const SENT = [['엄마 사랑해요','💗'],['안녕하세요','👋'],['학교에 가요','🏫'],['사과를 먹어요','🍎'],['책을 읽어요','📖'],['비가 와요','🌧️'],['꽃이 피었어요','🌸'],['나비가 날아요','🦋'],['친구와 놀아요','🤝'],['강아지가 뛰어요','🐶'],['나는 학생이에요','🧑‍🎓'],['하늘이 맑아요','☀️']];
const DISP = {}; CATS['문장'] = SENT.map(([t,e])=>{ const k = t.replace(/\s/g,''); PIC[k] = e; DISP[k] = t; return k; });
const J_BASIC_C = JAMO_C, J_BASIC_V = JAMO_V, J_MORE = 'ㄲㄸㅃㅆㅉㅐㅔㅒㅖㅘㅙㅚㅝㅞㅟㅢ'.split('');

/* ---------------- 자모 분해 ---------------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const NAME = {ㄱ:'기역',ㄲ:'쌍기역',ㄴ:'니은',ㄷ:'디귿',ㄸ:'쌍디귿',ㄹ:'리을',ㅁ:'미음',ㅂ:'비읍',ㅃ:'쌍비읍',ㅅ:'시옷',ㅆ:'쌍시옷',ㅇ:'이응',ㅈ:'지읒',ㅉ:'쌍지읒',ㅊ:'치읓',ㅋ:'키읔',ㅌ:'티읕',ㅍ:'피읖',ㅎ:'히읗',
  ㅏ:'아',ㅐ:'애',ㅑ:'야',ㅒ:'얘',ㅓ:'어',ㅔ:'에',ㅕ:'여',ㅖ:'예',ㅗ:'오',ㅘ:'와',ㅙ:'왜',ㅚ:'외',ㅛ:'요',ㅜ:'우',ㅝ:'워',ㅞ:'웨',ㅟ:'위',ㅠ:'유',ㅡ:'으',ㅢ:'의',ㅣ:'이',
  ㄳ:'기역시옷',ㄵ:'니은지읒',ㄶ:'니은히읗',ㄺ:'리을기역',ㄻ:'리을미음',ㄼ:'리을비읍',ㄽ:'리을시옷',ㄾ:'리을티읕',ㄿ:'리을피읖',ㅀ:'리을히읗',ㅄ:'비읍시옷'};
const isSyl = c => c >= '가' && c <= '힣';

/* ---------------- 그림판 (필기) ---------------- */
let target = '', level = 'kid', plist = [], pidx = -1;
const cv = $('cv'), ctx = cv.getContext('2d');
let strokes = [], cur = null, t0 = 0, drawing = false;
function setAppH(){ document.documentElement.style.setProperty('--appH', Math.round(window.visualViewport ? visualViewport.height : innerHeight) + 'px'); }
setAppH(); addEventListener('resize', setAppH); addEventListener('orientationchange', setAppH);
window.visualViewport && visualViewport.addEventListener('resize', setAppH);
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function bgDark(){ if (darkMQ.matches) return true; const m = (getComputedStyle($('pad')).backgroundColor||'').match(/\d+(\.\d+)?/g); if (!m || m.length < 3) return false; return (0.299*m[0] + 0.587*m[1] + 0.114*m[2]) < 128; }
let inkPick = 'auto';   // 글씨 색 직접 고르기 (저장 안 함)
const lum = c => { const m = c.replace('#','').match(/../g).map(h=>parseInt(h,16)); return 0.299*m[0] + 0.587*m[1] + 0.114*m[2]; };
const inkColor = () => inkPick !== 'auto' ? inkPick : (bgDark() ? '#ffffff' : '#1c2030');
const haloColor = () => { const k = inkColor(); return lum(k) > 128 ? 'rgba(0,0,0,.85)' : 'rgba(255,255,255,.9)'; };   // 글씨와 반대색 테두리
darkMQ.addEventListener && darkMQ.addEventListener('change', ()=>redraw());
function fit(){ const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width*d; cv.height = r.height*d; ctx.setTransform(d,0,0,d,0,0); redraw(); fitGuide(); }
function redraw(){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  const w = level === 'kid' ? 9 : 6, ink = inkColor(), halo = haloColor();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [col, lw] of [[halo, w + 4], [ink, w]]){
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    for (const s of strokes){ ctx.beginPath(); s[0].forEach((x,i)=> i ? ctx.lineTo(x,s[1][i]) : ctx.moveTo(x,s[1][i])); if (s[0].length===1) ctx.lineTo(s[0][0]+.1,s[1][0]); ctx.stroke(); }
  }
}
let lastPad = '';
function fitIfChanged(){ const r = cv.getBoundingClientRect(), k = Math.round(r.width)+'x'+Math.round(r.height)+'@'+(devicePixelRatio||1); if (k !== lastPad){ lastPad = k; fit(); } }
addEventListener('resize', fitIfChanged); addEventListener('pointerdown', ()=>{}, {passive:true}); new ResizeObserver(fitIfChanged).observe($('pad')); fitIfChanged();

const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
let autoT = null;
cv.addEventListener('pointerdown', e=>{
  clearTimeout(autoT); cv.setPointerCapture(e.pointerId); drawing = true; $('hint').style.display = 'none';
  if (!t0) t0 = performance.now();
  const [x,y] = pos(e); cur = [[x],[y],[Math.round(performance.now()-t0)]]; strokes.push(cur); redraw();
});
cv.addEventListener('pointermove', e=>{ if (!drawing) return; const [x,y] = pos(e); cur[0].push(x); cur[1].push(y); cur[2].push(Math.round(performance.now()-t0)); redraw(); });
cv.addEventListener('pointercancel', ()=>{ drawing = false; });
cv.addEventListener('pointerup', ()=>{ drawing = false; clearTimeout(autoT); autoT = setTimeout(()=>{ if (strokes.length && !drawing) $('bWrite').click(); }, level === 'kid' ? 1800 : 1300); });   // 1.3초 쉬면 자동 인식

function clearPad(){ clearTimeout(autoT); strokes = []; t0 = 0; redraw(); $('cands').innerHTML = ''; $('hint').style.display = target ? 'none' : ''; }
$('bClear').onclick = clearPad;
const setStatus = s => { $('status').textContent = s || ''; };

/* ---------------- 따라 쓰기 (바탕 글자 안내) ---------------- */

}
const BAD_F = new Set('ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ'), BAD_V = new Set('ㅘㅙㅚㅝㅞㅟㅢㅒㅖ'), BAD_C = new Set('ㄲㄸㅃㅆㅉ');
const easy = w => [...w].length <= 2 && [...w].every(c=>{ const x = split(c); return !BAD_F.has(x.f) && !BAD_V.has(x.v) && !BAD_C.has(x.c); });
const KID_CATS = ['자모','동물','먹거리','탈것·물건','몸·자연'], SCH_CATS = ['자모','동물','먹거리','탈것·물건','몸·자연','학교·가족','문장'];
const CAT_LABEL = {'자모':'ㄱㄴㄷ','동물':'🐶 동물','먹거리':'🍎 먹거리','탈것·물건':'🚗 탈것','몸·자연':'🌳 몸·자연','학교·가족':'🏫 학교·가족','문장':'💬 문장'};
const listFor = c => c === '자모' ? (level === 'kid' ? [...J_BASIC_C, ...J_BASIC_V] : [...J_BASIC_C, ...J_BASIC_V, ...J_MORE]) : (CATS[c]||[]).filter(w=> level === 'school' || easy(w));
function renderCats(){

  (level === 'kid' ? KID_CATS : SCH_CATS).forEach(c=>{ const b = document.createElement('button'); b.className = 'seg'; b.dataset.c = c; b.textContent = CAT_LABEL[c]; b.onclick = ()=>{ box.querySelectorAll('.seg').forEach(x=>x.classList.toggle('on', x===b)); showCat(c); }; box.appendChild(b); });

    ? '글자를 쓰거나 말해 보세요! 아래 ‘따라 쓰기’ 버튼을 누르면 흐린 글자 위에 따라 쓸 수 있어요.'
    : '한글을 쓰거나 말하면 자음·모음·받침 풀이와 쓰임이 나와요. ‘따라 쓰기’로 낱말과 문장을 연습해 보세요.';
}
document.querySelectorAll('#level .seg').forEach(b=> b.onclick = ()=>{
  level = b.dataset.l; document.querySelectorAll('#level .seg').forEach(x=>x.classList.toggle('on', x===b));
  clearPad(); setTarget(''); plist = []; pidx = -1; renderCats(); redraw();
  $('big').className = 'placeholder'; $('big').textContent = '한글'; $('pic').textContent = ''; $('reading').textContent = '';
  $('info').innerHTML = '<h2 id="infoH">글자 풀이</h2><p class="placeholder" id="intro"></p>'; intro(); setStatus('');
  say(level === 'kid' ? '유아 단계예요' : '일 이학년 단계예요');
});
function showCat(c){
  const list = listFor(c), jm = c === '자모';
  $('big').className = ''; $('big').textContent = jm ? 'ㄱㄴㄷ' : c.replace('·',' ');
  $('pic').textContent = jm ? '' : PIC[list[0]] || ''; $('reading').textContent = `${list.length}개 · 눌러서 따라 써 보세요`;
  $('info').innerHTML = `<h2>${esc(c)} (${list.length})</h2><div class="gchips">${list.map(w=>`<button class="gc" data-w="${esc(w)}">${esc(shown(w))}${jm?`<small>${esc(NAME[w])}</small>`:`<i>${PIC[w]||''}</i>`}</button>`).join('')}</div>`;
  $('info').querySelectorAll('.gc').forEach(b=> b.onclick = ()=>{ clearPad(); plist = list; pidx = list.indexOf(b.dataset.w); practice(b.dataset.w); });

function practice(w){
  setTarget(w); lookup(w, true);

let starN = 0;
function addStar(){ starN++; $('stars').textContent = '⭐'.repeat(Math.min(starN,10)) + (starN > 10 ? ` ×${starN}` : ''); }

/* ---------------- 필기 인식 (구글 Input Tools, 비공식) ---------------- */
$('bWrite').onclick = async ()=>{
  if (!strokes.length){ setStatus('먼저 왼쪽 칸에 글씨를 써 주세요.'); return; }
  setStatus('필기를 인식하는 중…');
  const r = cv.getBoundingClientRect();
  try{
    const res = await fetch('https://inputtools.google.com/request?itc=ko-t-i0-handwrit&app=hangul',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:Math.round(r.width),writing_area_height:Math.round(r.height)},ink:strokes,language:'ko',max_num_results:10}]})});
    const raw = await res.json();
    if (raw[0] !== 'SUCCESS') throw new Error('인식 실패');
    const c = (raw[1]?.[0]?.[1] || []).map(clean).filter(Boolean);
    $('cands').innerHTML = '';
    c.forEach(w=>{ const b = document.createElement('button'); b.className='chip'; b.textContent = w; b.onclick = ()=>lookup(w); $('cands').appendChild(b); });
    handleResult(c);
  }catch(e){ setStatus('오류: ' + e.message + ' (인터넷 연결을 확인해 주세요)'); }
};

// 인식 결과 처리: 따라 쓰기 중이면 정답 확인, 아니면 사전에 있는 후보 우선
const NOT_MSG = '글자를 알아보기 어려워요. 다시 써 주세요.';
function notRecognized(){
  setStatus(NOT_MSG); $('cands').innerHTML = '';
  const last = strokes[strokes.length - 1], n = strokes.length;
  // 안내가 끝나면 쓴 글씨를 자동으로 지움 (그 사이 새로 쓰기 시작했으면 지우지 않음)
  say(NOT_MSG, ()=>{ if (strokes.length === n && strokes[strokes.length - 1] === last && !drawing && n) clearPad(); });
}
function handleResult(c){
  if (!c.length) return notRecognized();
  if (target){
    if (c.slice(0,3).includes(target)){ return success(target); }   // 상위 3개 안에 있으면 정답
    setStatus(`인식: ${c[0]} · 「${shown(target)}」 모양을 다시 따라 써 볼까요?`); lookup(c[0], true); return;
  }
  const pick = c[0];   // 인식 엔진의 첫 번째 결과를 그대로 사용 (다른 후보는 칸 안의 글자 버튼으로 고르기)
  setStatus(`인식: ${pick}`); lookup(pick);
}
function success(w){
  setStatus(`🎉 참 잘했어요! 「${shown(w)}」`); addStar();
  lookup(w, true); const b = $('big'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  say(`참 잘했어요. ${shown(w)}`);
  if (plist.length && pidx >= 0){ const nx = plist[(pidx + 1) % plist.length]; const c = $('cands'); c.innerHTML = '';
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = `다음 ▶ ${shown(nx)}`; b.onclick = ()=>{ clearPad(); pidx = (pidx + 1) % plist.length; practice(nx); }; c.appendChild(b); }
}

/* ---------------- 음성 인식 (🎤 하나로 켜고 끄기) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = '', alts = [], recErr = false, muteUntil = 0;
const speaking = () => ('speechSynthesis' in window) && speechSynthesis.speaking;
function setMic(on){ $('bRec').classList.toggle('on', on); $('bRec').textContent = on ? '👂' : '🎤'; }
$('bRec').onclick = ()=>{
  if (!SR){ setStatus('이 브라우저는 음성 인식이 안 돼요. 크롬이나 사파리로 열어 주세요.'); return; }
  if (rec){ rec.stop(); setStatus('🎤를 누르면 다시 들어요'); return; }   // 듣는 중에 다시 누르면 멈춤
  if (speaking() || Date.now() < muteUntil){ setStatus('말이 끝나면 🎤를 눌러 주세요.'); return; }
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 5; finalText = ''; alts = []; recErr = false;
  rec.onstart = ()=>{ setMic(true); setStatus('👂 듣고 있어요… 말해 보세요!'); };
  rec.onresult = e=>{
    if (speaking() || Date.now() < muteUntil) return;   // 앱이 말하는 소리는 무시
    let t = ''; for (const r of e.results){ t += r[0].transcript; if (r.isFinal){ finalText = t; alts = [...r].map(a=>a.transcript); } }
    setStatus('듣는 중: ' + t);
  };
  rec.onerror = e=>{
    recErr = true;
    if (e.error === 'no-speech') setStatus('소리가 안 들렸어요. 🎤를 다시 눌러 볼까요?');
    else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') setStatus('마이크를 허용해 주세요 🙏 (주소창 왼쪽 자물쇠)');
    else if (e.error === 'network') setStatus('인터넷이 필요해요 📶');
    else if (e.error !== 'aborted'){ setStatus('다시 한 번 말해 주세요!'); }
  };
  rec.onend = ()=>{
    setMic(false); rec = null;
    const cand = [finalText, ...alts].map(x=>clean(x.replace(/\s/g,''))).filter(Boolean);
    if (cand.length) handleResult(cand);
    else if (!recErr){ setStatus('못 알아들었어요. 다시 말해 볼까요?'); say('다시 한 번 말해 줄래요?'); }
  };
  rec.start();
};

// 버튼 탭: pointerup 으로 바로 실행하고, 이어서 오는 click 은 무시
function onTap(el){
  const fn = el.onclick; el.onclick = null; let last = 0;
  el.addEventListener('pointerup', e=>{ if (e.pointerType === 'mouse' && e.button !== 0) return; last = Date.now(); fn.call(el, e); });
  el.addEventListener('click', e=>{ if (Date.now() - last < 700) return; fn.call(el, e); });
}
['bWrite','bRec','bClear'].forEach(id=> onTap($(id)));

/* ---------------- 보여주기 ---------------- */
const picOf = w => PIC[w] || [...new Set([...w].map(c=>PIC[c]).filter(Boolean))].slice(0,2).join('');
const jamoText = c => { const s = split(c); return s.c + s.v + s.f; };
function lev1(a,b){
  if (a === b) return true; const la = a.length, lb = b.length; if (Math.abs(la-lb) > 1) return false;
  let i = 0; while (i < la && i < lb && a[i] === b[i]) i++;
  if (la === lb) return a.slice(i+1) === b.slice(i+1);
  return la > lb ? a.slice(i+1) === b.slice(i) : b.slice(i+1) === a.slice(i);
}
function lookup(text, keepTarget){
  window.aieduLog && aieduLog('use');   // 이용 기록(횟수만, 입력 내용은 보내지 않음)
  const t = clean(text); if (!t) { setStatus('글자를 알아보지 못했어요.'); return; }
  if (!keepTarget && target && t !== target){ /* 자유 입력으로 돌아가면 안내 글자 해제 */ setTarget(''); }
  const chars = [...t];
  const big = $('big'); big.className = ''; big.textContent = shown(t); $('pic').textContent = picOf(t);
  const sylls = chars.filter(isSyl);
  $('reading').textContent = sylls.length ? (sylls.length === 1 ?  jamoText(sylls[0]).split('').join(' + ') : sylls.join(' · ')) : (NAME[chars[0]] || '');
  // 글자 풀이
  const rows = chars.map(c=>{
    if (isSyl(c)){ const s = split(c);
      return `<b>${esc(c)}</b> = <span class="jm">${s.c}</span><small>${NAME[s.c]}</small> + <span class="jm">${s.v}</span><small>${NAME[s.v]}</small>${s.f ? ` + <span class="jm">${s.f}</span><small>${NAME[s.f]||''} 받침</small>` : (level === 'kid' ? '' : ' <small>(받침 없음)</small>')}`; }
    return `<b>${esc(c)}</b> = ${esc(NAME[c]||'')} ${JAMO_C.includes(c)||CHO.includes(c) ? '(자음)' : '(모음)'}`; });
  const used = ALL.filter(w=> w !== t && chars.some(c=>w.includes(c)) && (level === 'school' || easy(w))).slice(0, level === 'kid' ? 6 : 12);
  const near = PIC[t] ? [] : ALL.filter(w=>lev1(w,t)).slice(0,6);
  $('info').innerHTML = `<h2>글자 풀이</h2>
    <div class="tag">${level === 'kid' ? '자음 + 모음' : '자음 + 모음 (+ 받침)'}</div><p>${rows.join('<br>')}</p>
    ${PIC[t] ? `<div class="tag">그림 낱말</div><p>${PIC[t]} ${esc(shown(t))}</p>` : ''}
    ${near.length ? `<div class="tag">혹시 이 낱말인가요?</div><div class="gchips">${near.map(w=>`<button class="gc" data-w="${esc(w)}">${esc(w)}<i>${PIC[w]}</i></button>`).join('')}</div>` : ''}
    ${used.length ? `<div class="tag" style="margin-top:8px">같은 글자가 쓰인 낱말</div><ul class="cols">${used.map(w=>`<li>${PIC[w]} ${esc(w)}</li>`).join('')}</ul>` : ''}`;
  $('info').querySelectorAll('.gc').forEach(b=> b.onclick = ()=>{ clearPad(); practice(b.dataset.w); });
  say(chars.length === 1 && isJamo(chars[0]) ? NAME[chars[0]] : spoken(t));
}

/* ---------------- 읽어주기 (기기 기본 목소리) ---------------- */
let lastSay = '';
// 한국어 목소리를 직접 고른다 (기본 목소리가 한국어가 아니면 '바'가 '따'처럼 들릴 수 있음)
let pickedVoice = '';   // 고른 목소리 이름 (저장 안 함)
const koVoices = () => ('speechSynthesis' in window ? speechSynthesis.getVoices() : []).filter(x=>/^ko/i.test(x.lang));
function koVoice(){ const v = koVoices(); return v.find(x=>x.name === pickedVoice) || v.find(x=>x.localService) || v[0] || null; }
function fillVoices(){
  const sel = $('voice'), v = koVoices(); sel.innerHTML = '<option value="">자동</option>' + v.map(x=>`<option value="${esc(x.name)}">${esc(x.name.replace(/^(Microsoft|Google)\s*/,'$1 ').replace(/\s*-?\s*Korean.*|\(.*\)/g,'').trim() || x.name)}${x.localService ? '' : ' ☁'}</option>`).join('');
  if (!v.length) sel.options[0].textContent = '한국어 목소리 없음'; sel.value = v.some(x=>x.name === pickedVoice) ? pickedVoice : '';
}
if ('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = fillVoices; setTimeout(fillVoices, 0); }
// 글자 하나는 엔진이 잘못 읽기 쉬워서 낱말 예시를 붙여 읽어 준다 (바 → "바. 바나나의 바")
function spoken(t){
  const cs = [...t]; if (cs.length !== 1 || !isSyl(cs[0])) return shown(t);
  const w = ALL.find(x=>x[0] === cs[0] && x.length > 1);
  return w ? `${t}. ${w}의 ${t}` : `${t}. ${t}`;
}
function say(text, then){
  let fin = false; const done = ()=>{ if (!fin){ fin = true; then && then(); } };
  lastSay = text || lastSay; if (!lastSay || !('speechSynthesis' in window)){ then && setTimeout(done, 1500); return; }
  if (then) setTimeout(done, 3000 + lastSay.length * 450);   // 읽기가 멈추지 않아도 지우기는 진행
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(lastSay); u.lang = 'ko-KR'; const kv = koVoice(); if (kv) u.voice = kv; u.rate = +$('rate').value; u.volume = +$('vol').value; u.onend = u.onerror = ()=>{ muteUntil = Date.now() + 900; done(); }; speechSynthesis.speak(u); }catch(e){}
}
function showVox(){ $('rateV').textContent = (+$('rate').value).toFixed(1); $('volV').textContent = (+$('vol').value).toFixed(1); }
['rate','vol'].forEach(id=>{ $(id).addEventListener('input', showVox); $(id).addEventListener('change', ()=>say(lastSay || '안녕')); });
showVox();
$('voice').addEventListener('change', ()=>{ pickedVoice = $('voice').value; say('바. 바나나의 바'); });
document.querySelectorAll('#inks .ink').forEach(b=> b.onclick = ()=>{ inkPick = b.dataset.k; document.querySelectorAll('#inks .ink').forEach(x=>x.classList.toggle('on', x===b)); redraw(); });
document.querySelector('.hrow').addEventListener('click', ()=>say());
$('listen').addEventListener('click', ()=>say());
$('vtoggle').addEventListener('click', ()=>{ document.querySelector('.hangul').classList.toggle('showvox'); setTimeout(fitBig, 0); });

// 글자 칸 크기에 맞춰 글자 크기를 자동 조절
function fitBig(){
  const row = document.querySelector('.hrow'), n = [...$('big').textContent].length || 1, pic = $('pic').textContent;
  const units = n * 1.05 + (pic ? 0.2 + 0.75 * ([...pic].length > 6 ? 2 : 1) : 0);
  row.style.fontSize = Math.max(24, Math.min((row.clientWidth - 8) / units, (row.clientHeight - 4) / 1.18, 340)) + 'px';
}
new MutationObserver(fitBig).observe(document.querySelector('.hrow'),{childList:true,characterData:true,subtree:true});
addEventListener('resize', fitBig); new ResizeObserver(fitBig).observe(document.querySelector('.hrow')); fitBig();
renderCats(); intro();
</script>
